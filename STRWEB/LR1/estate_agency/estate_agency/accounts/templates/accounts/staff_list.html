{% extends 'base.html' %} 
{% load static %} 
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/staff.css' %}" />
<link rel="stylesheet" href="{% static 'css/preloader.css' %}" />
{% endblock %} 
{% block content %}
<div class="staff-page">
  <header class="staff-header">
    <h1>Наши сотрудники</h1>
    {% if user.userprofile.role == 'admin' %}
    <nav>
      <button class="staff-add-button">Добавить сотрудника</button>
    </nav>
    {% endif %}
  </header>

  <article>
    <section class="staff-filter-container">
      <h3>Фильтрация:</h3>
      <input id="staff-filter-input">
      <button id="staff-filter-button">Найти</button>
    </section>
    <section class="staff-bonus-container">
      <button id="staff-bonus-button" class="staff-bonus-button">Премировать</button>
      <p id="staff-bonus-message" class="staff-bonus-message"></p>
    </section>
    <section class="staff-table"></section>
    <section class="staff-detail" id="staff-detail" style="display: none;">
      <h2 id="staff-detail-name"></h2>
      <img id="staff-detail-photo" src="" alt="Фото">
      <p><strong>Должность:</strong> <span id="staff-detail-position"></span></p>
      <p><strong>Опыт:</strong> <span id="staff-detail-experience"></span></p>
      <p><strong>Email:</strong> <a id="staff-detail-email" href=""></a></p>
      <p><strong>Телефон:</strong> <a id="staff-detail-phone" href=""></a></p>
    </section>
  </article>
</div>

<div class="modal-preloader" id="modal-preloader" style="display: none;">
  <div class="preloader-container">
    <div class="preloader-dots">
      <div class="preloader-dot"></div>
      <div class="preloader-dot"></div>
      <div class="preloader-dot"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" style="display: none;">
  <div class="modal-content">
    <h2>Добавить сотрудника</h2>
    <form id="add-staff-form">
      <div class="form-group">
        <label for="modal-username">Имя пользователя *</label>
        <input type="text" id="modal-username" required>
      </div>
      <div class="form-group">
        <label for="modal-email">Email *</label>
        <input type="email" id="modal-email" required>
      </div>
      <div class="form-group">
        <label for="modal-password">Пароль *</label>
        <input type="password" id="modal-password" required>
      </div>
      <div class="form-group">
        <label for="modal-phone">Телефон *</label>
        <input type="text" id="modal-phone" placeholder="+375 (29) XXX-XX-XX" required>
      </div>
      <div class="form-group">
        <label for="modal-birth-date">Дата рождения *</label>
        <input type="text" id="modal-birth-date" placeholder="DD/MM/YYYY" required>
      </div>
      <div class="form-group">
        <label for="modal-first-name">Имя</label>
        <input type="text" id="modal-first-name">
      </div>
      <div class="form-group">
        <label for="modal-last-name">Фамилия</label>
        <input type="text" id="modal-last-name">
      </div>
      <div class="form-group">
        <label for="modal-position">Должность *</label>
        <input type="text" id="modal-position" required>
      </div>
      <div class="form-group">
        <label for="modal-experience">Опыт работы (лет) *</label>
        <input type="number" id="modal-experience" min="0" required>
      </div>
      <div class="form-group">
        <label for="modal-url">URL *</label>
        <input type="text" id="modal-url" placeholder="http://example.com/page.php" required>
      </div>
      <div class="form-group">
        <label for="modal-photo">Фото</label>
        <input type="file" id="modal-photo" accept="image/*">
      </div>
      <div class="form-actions">
        <button type="button" class="modal-cancel" id="modal-cancel">Отмена</button>
        <button type="submit" class="modal-submit" id="modal-submit" disabled>Добавить в таблицу</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/staff.js' %}"></script>
{% endblock %}
