{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/agent_property_confirm_delete.css' %}">
{% endblock %}

{% block content %}
<div class="agent-property-confirm-delete-container">
  <header class="agent-property-confirm-delete-header">
    <h1>Подтверждение удаления</h1>
  </header>

  <section class="agent-property-confirm-delete-section">
    <div class="confirm-delete-content">
      <p>
        Вы уверены, что хотите удалить объект недвижимости "{{ property.title }}"?
      </p>
      <p>Это действие нельзя отменить.</p>
    </div>

    <form method="post" class="confirm-delete-form">
      {% csrf_token %}
      <button type="submit">Удалить</button>
      <a href="{% url 'agent_property_list' %}">Отмена</a>
    </form>
  </section>
</div>
{% endblock %}
