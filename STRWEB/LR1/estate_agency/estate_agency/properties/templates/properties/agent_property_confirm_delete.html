{% extends 'base.html' %} 
{% block content %}
<header>
  <h1>Подтверждение удаления</h1>
</header>

<section>
  <p>
    Вы уверены, что хотите удалить объект недвижимости "{{ property.title }}"?
  </p>
  <p>Это действие нельзя отменить.</p>

  <form method="post">
    {% csrf_token %}
    <nav>
      <button type="submit">Удалить</button>
      <a href="{% url 'agent_property_list' %}">Отмена</a>
    </nav>
  </form>
</section>
{% endblock %}
