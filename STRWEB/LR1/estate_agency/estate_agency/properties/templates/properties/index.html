{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/properties.css' %}">
<link rel="stylesheet" href="{% static 'css/property-card.css' %}">
{% endblock %}

{% block content %}
<div class="catalog-container">
    <header class="catalog-header">
        <h1>Объекты недвижимости</h1>
    </header>

    <aside class="catalog-filters">
        <header>
            <h2>Фильтры</h2>
        </header>
        
        <form method="get">
            <fieldset>
                <legend>Параметры поиска</legend>
                
                <div class="filter-grid">
                    <div class="filter-group">
                        <label for="min_price">Минимальная цена</label>
                        <input type="number" id="min_price" name="min_price" value="{{ current_filters.min_price }}" placeholder="0">
                    </div>
                    <div class="filter-group">
                        <label for="max_price">Максимальная цена</label>
                        <input type="number" id="max_price" name="max_price" value="{{ current_filters.max_price }}" placeholder="1000000">
                    </div>
                    <div class="filter-group">
                        <label for="category">Категория</label>
                        <select id="category" name="category">
                            <option value="">Все категории</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}" {% if current_filters.category_id == category.id|stringformat:"i" %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="date_from">Дата от</label>
                        <input type="text" id="date_from" name="date_from"
                               value="{{ current_filters.date_from|default_if_none:'' }}" placeholder="DD/MM/YYYY">
                    </div>
                    <div class="filter-group">
                        <label for="date_to">Дата до</label>
                        <input type="text" id="date_to" name="date_to"
                               value="{{ current_filters.date_to|default_if_none:'' }}" placeholder="DD/MM/YYYY">
                    </div>
                </div>
            </fieldset>
            
            <div class="filter-actions">
                <button id="filter-submit-button" type="submit">Применить фильтры</button>
                <a href="{% url 'index' %}">Очистить фильтры</a>
            </div>
        </form>
        
        <div class="pagination-controls">
            <div class="filter-group">
                <label for="pagination-limit">Элементов на странице:</label>
                <input type="number" id="pagination-limit" name="pagination-limit" min="1" max="20" value="3">
            </div>
        </div>
    </aside>

    <section class="catalog-properties">
        <div class="properties-grid"></div>
    </section>
</div>

<script src="{% static 'js/properties.js' %}"></script>
{% endblock %}
