{% extends 'base.html' %} {% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3>Подтверждение удаления</h3>
    </div>
    <div class="card-body">
      <p>
        Вы уверены, что хотите удалить объект недвижимости "{{ property.title
        }}"?
      </p>
      <p class="text-danger">Это действие нельзя отменить.</p>

      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'agent_property_list' %}" class="btn btn-secondary"
          >Отмена</a
        >
      </form>
    </div>
  </div>
</div>
{% endblock %}
