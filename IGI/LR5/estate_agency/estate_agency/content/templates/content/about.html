{% extends 'base.html' %}

{% block title %}О компании{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">О компании</h1>
    {% if about_info %}
        <div class="card">
            <div class="card-body">
                {{ about_info.company_info|linebreaks }}
            </div>
        </div>
    {% else %}
        <p>Информация о компании пока не добавлена.</p>
    {% endif %}
</div>
{% endblock %}
